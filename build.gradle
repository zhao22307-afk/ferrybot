// 与你旧工程一致的版本：AGP 9.3.0 + Kotlin 2.3.10 + Gradle 9.7.1
// AGP 9 起 Kotlin 支持已内置（built-in Kotlin），
// 再应用 org.jetbrains.kotlin.android 会直接报错，所以这里不再声明它。
// Kotlin 编译器版本跟随 buildscript classpath 上的 KGP，
// 由下面的 compose 插件（2.3.10）带入；想换 Kotlin 版本就改这个版本号。
plugins {
    id 'com.android.application' version '9.3.0' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.10' apply false
}
