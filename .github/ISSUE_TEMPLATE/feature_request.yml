name: 功能建议
description: 想要的新能力、改进或文档修正
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说清楚「想解决什么问题」比「想加什么按钮」更有用。
        本项目是自用向工具，明确不做的事见 README 的「已知限制」和 [CONTRIBUTING](https://github.com/zhao22307-afk/ferrybot/blob/main/CONTRIBUTING.md) 的「不能接受的内容」。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      placeholder: 例如：群消息太多时机器人回复很慢，想在长上下文里做截断
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么做
      description: 有想法就写，没有也行
      placeholder: 例如：在「对话 → 模型」里加一个「上下文上限」滑块，超过就丢弃最早的消息
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 聊天 / 人设 / 记忆
        - 消息与素材（表情、图片、语音）
        - 接入（官方机器人 / OneBot）
        - 手机内 Linux 环境 / NapCat
        - 语音（TTS / ASR / 声音复刻）
        - 技能与插件
        - 界面与交互
        - 文档与构建
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 有没有别的办法
      description: 现在你是怎么绕过去的？
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 搜索过现有 Issue，没有重复
          required: true
        - label: 这个功能和「骚扰 / 诈骗 / 批量营销 / 绕过风控」无关
          required: true