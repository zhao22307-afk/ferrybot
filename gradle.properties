# Gradle 构建参数（内存、增量、并行等）
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=google
# Kotlin 编译放到 Gradle 进程内：少起一个 daemon，构建更快，
# 也避免临时目录权限受限时 daemon 的临时文件写失败（AccessDeniedException ...kotlin-daemon-client...tmp）
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true